name: Update SideStore Source

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-source]
  schedule:
    # Daily at 02:00 UTC (10:00 Asia/Shanghai)
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update-source:
    name: Refresh source.json from latest releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify source.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_source.py --output source.json

      - name: Validate JSON structure
        run: |
          python3 -c '
          import json
          with open("source.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["identifier"] == "com.haywoodw04.ipad-app-store"
          assert len(data["apps"]) == 2
          for app in data["apps"]:
              assert app["versions"], f"Missing versions for {app[\"name\"]}"
              v0 = app["versions"][0]
              for key in ("version", "buildVersion", "date", "downloadURL", "size", "minOSVersion", "sha256"):
                  assert v0.get(key), f"Missing {key} for {app[\"name\"]}"
              assert len(v0["sha256"]) == 64
          print("source.json validation passed.")
          '

      - name: Commit and push updated source.json
        run: |
          if git diff --quiet source.json; then
            echo "source.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore(source): auto-update source.json from latest releases"
          git push
